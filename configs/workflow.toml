# Paths resolve relative to root, which is relative to this config file.
[run]
root = ".."
csv_path = "data/creilov.csv"
output_dir = "outputs/workflow"
seed = 42
device = "cpu" # local execution only; Modal always overrides this to cuda
train_split = "random"

[oracle]
kind = "one_hot_mlp" # one_hot_mlp, linear_probe, additive
ensemble_size = 10
hidden_dim = 400
hidden_layers = 1
dropout = 0.1
backbone = "esmc_300m" # used by linear_probe; also supports esmc_600m, esm3-open

[predictor]
kind = "one_hot_mlp"
ensemble_size = 5
hidden_dim = 400
hidden_layers = 1
dropout = 0.1
backbone = "esmc_300m"

[oracle_training]
epochs = 30
batch_size = 128
learning_rate = 0.001
weight_decay = 0.01
patience = 5
max_train = 0 # all TRAINING rows, never validation or test

[predictor_training]
epochs = 30
batch_size = 128
learning_rate = 0.001
weight_decay = 0.01
patience = 5
max_train = 2000

[splits]
train_fraction = 0.8
validation_fraction = 0.1
distance_train_max = 7
distance_validation_max = 8
activity_train_quantile = 0.8
activity_validation_quantile = 0.9
validation_positions = [60]
test_positions = [98] # 1-based; training has WT at both held-out sites

[guidance]
method = "tag" # tag or deg
generator = "esm3-open" # esm3-open, esmc_300m, esmc_600m
threshold = 4.1 # event is Y > threshold, original log10 fluorescence
generator_temperature = 0.7
predictor_temperature = 1.0
min_sigma = 0.05
mask_fraction = 1.0 # start with the entire sequence masked
position = 7 # position examined by the guidance CLI check

[evaluation]
mask_fractions = [0.0, 0.5, 0.9]
top_k = 100
max_rows = 0 # all evaluation rows; set a positive cap for a cheaper first benchmark
